name: Container verification
on:
  pull_request:
  push:
    branches: [main, codex/mlops-task-4-container]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        working-directory: starter
        run: |
          cp .env.example .env
          MODEL_SOURCE=huggingface docker compose config --quiet
      - name: Build and run the image
        working-directory: starter
        run: |
          docker build -t finbert-api:verify .
          docker network create finbert-monitoring
          docker run -d --network finbert-monitoring --network-alias api --name finbert-verify -p 8000:8000 -e HF_HUB_OFFLINE=1 finbert-api:verify
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8000/health; then break; fi
            sleep 2
          done
          curl --fail http://localhost:8000/health
          docker run -d --name prometheus-verify --network finbert-monitoring -p 9090:9090 -v "$PWD/prometheus.yml:/etc/prometheus/prometheus.yml:ro" prom/prometheus:v3.2.1
      - name: Verify real predictions
        run: |
          python - <<'PY'
          import json, urllib.request
          for path, payload, expected in [
              ('/predict', {'text': 'The company reported record profits.'}, 1),
              ('/predict/batch', {'texts': ['The company reported record profits.', 'Stocks closed flat.']}, 2),
          ]:
              request = urllib.request.Request('http://localhost:8000' + path,
                  data=json.dumps(payload).encode(), headers={'Content-Type': 'application/json'})
              with urllib.request.urlopen(request) as response:
                  result = json.load(response)
              items = result if isinstance(result, list) else [result]
              assert len(items) == expected
              for item in items:
                  assert item['sentiment'] in {'positive', 'negative', 'neutral'}
                  assert 0 <= item['confidence'] <= 1 and item['latency_ms'] >= 0
          PY
      - name: Verify Prometheus scraping
        run: |
          python - <<'PY'
          import json, time, urllib.request, urllib.error
          for attempt in range(20):
              try:
                  with urllib.request.urlopen('http://localhost:9090/api/v1/targets') as response:
                      targets = json.load(response)['data']['activeTargets']
                  if any(target['labels'].get('job') == 'finbert-api' and target['health'] == 'up' for target in targets):
                      break
              except urllib.error.URLError:
                  pass
              time.sleep(2)
          else:
              raise RuntimeError('Prometheus API target did not become healthy')
          with urllib.request.urlopen('http://localhost:8000/metrics') as response:
              assert 'finbert_prediction_requests_total' in response.read().decode()
          print('Prometheus successfully scraped the API')
          PY
      - name: Container diagnostics
        if: always()
        run: |
          docker logs finbert-verify || true
          docker logs prometheus-verify || true
          docker inspect finbert-verify --format '{{json .State}}' || true
