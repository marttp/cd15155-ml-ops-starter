name: MLOps CI and ECS delivery
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mlops-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false
env:
  ECR_REPOSITORY: finbert-api
  TASK_DEFINITION: finbert-api
  CONTAINER_NAME: finbert-api
  ECS_SERVICE: finbert-api-service
  ECS_CLUSTER: finbert-cluster
  MODEL_SOURCE: huggingface
  HF_MODEL_ID: baptle/FinBERT_market_based
  HF_MODEL_REVISION: ec5ffa074fc00da4de8b28554a57aa1debf92508
  MODEL_NUM_THREADS: '2'
  TOKENIZERS_PARALLELISM: 'false'
defaults:
  run:
    working-directory: starter
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: ruff check --isolated --select E4,E7,E9,F app/ scripts/ tests/
  test:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: starter/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: finbert-${{ runner.os }}-ec5ffa074fc00da4de8b28554a57aa1debf92508
      - run: |
          pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - run: pytest tests/ -q
  deepchecks:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: starter/requirements.txt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            starter/.cache/deepchecks
          key: quality-${{ runner.os }}-ec5ffa074fc00da4de8b28554a57aa1debf92508
      - run: |
          pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - run: dvc repro
      - run: python scripts/run_deepchecks.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deepchecks-evidence
          path: starter/reports/deepchecks.json
          if-no-files-found: warn
  build:
    runs-on: ubuntu-latest
    needs: [test, deepchecks]
    if: github.event_name != 'pull_request'
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.image.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - run: pip install boto3==1.34.101
      - name: Ensure ECR exists
        run: python scripts/bootstrap_aws.py
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: Build and push both tags
        id: image
        env:
          REGISTRY: ${{ secrets.ECR_REGISTRY }}
          ACTUAL_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          test "$REGISTRY" = "$ACTUAL_REGISTRY" || { echo 'ECR_REGISTRY does not match the authenticated AWS account and region'; exit 1; }
          IMAGE_URI="$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          docker tag "$IMAGE_URI" "$REGISTRY/$ECR_REPOSITORY:latest"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"
          echo "tag=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Ensure ECS resources exist
        env:
          IMAGE_URI: ${{ secrets.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          ECS_EXECUTION_ROLE_ARN: ${{ vars.ECS_EXECUTION_ROLE_ARN }}
        run: python scripts/bootstrap_aws.py --image "$IMAGE_URI"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aws-resource-evidence
          path: starter/reports/aws-resources.json
          if-no-files-found: warn
  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Download current ECS definition
        run: |
          aws ecs describe-task-definition --task-definition "$TASK_DEFINITION" --query taskDefinition > task-definition.json
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --desired-count 1 > /dev/null
      - uses: aws-actions/amazon-ecs-render-task-definition@v1
        id: definition
        with:
          task-definition: starter/task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ secrets.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ needs.build.outputs.tag }}
      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.definition.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
      - run: pip install boto3==1.34.101 requests==2.32.3
      - run: python scripts/verify_deployment.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-evidence
          path: starter/reports/deployment.json
          if-no-files-found: warn
