# Optional full local stack, layered over the rubric's docker-compose.yml.
services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    ports:
      - "127.0.0.1:5001:5001"
    volumes:
      - mlflow-state:/mlflow
    command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5001", "--backend-store-uri", "sqlite:////mlflow/mlflow.db", "--serve-artifacts", "--artifacts-destination", "/mlflow/mlartifacts"]
  api:
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5001
      MODEL_SOURCE: mlflow
      MODEL_NAME: finbert
      MODEL_STAGE: production
    depends_on:
      mlflow:
        condition: service_started
volumes:
  mlflow-state:
